name: Update profile stats

on:
  schedule:
    - cron: "0 2 * * *"      # daily
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          GH_USER: ${{ github.repository_owner }}
          # STATS_TOKEN = PAT with `repo` scope to include private repos.
          # Falls back to the default token (public repos only).
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # EXCLUDE_LANGS: "HTML,CSS"
        run: python scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
